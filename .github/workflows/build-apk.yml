name: Build ClipCraft APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDK_MANAGER=$(find "$SDK_DIR" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore Firebase & Keystore configs from Secrets (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json missing. Add GOOGLE_SERVICES_JSON repository secret for live Firebase Auth/AI/Firestore."
          fi

          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > debug.keystore
              echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
            elif [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          cp debug.keystore /tmp/release-upload.jks
          keytool -changealias -keystore /tmp/release-upload.jks -alias androiddebugkey -destalias upload -storepass android -keypass android
          ls -lh debug.keystore /tmp/release-upload.jks
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release & Debug APKs
        env:
          KEYSTORE_PATH: /tmp/release-upload.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle assembleRelease assembleDebug --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g" --stacktrace

      - name: Clean up temporary release keystore
        if: always()
        run: rm -f /tmp/release-upload.jks

      - name: Upload ClipCraft Release APK (Recommended for Phone)
        uses: actions/upload-artifact@v4
        with:
          name: ClipCraft-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload ClipCraft Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipCraft-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
